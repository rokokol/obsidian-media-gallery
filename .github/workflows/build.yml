name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by vendor-sync.yml against its temp branch, so new vendored copies are checked by
  # this file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Every vendored copy is byte-equal to its source: one edited here instead of at the
      # source fails by name — see .github/vendor.lock
      - name: vendored copies are byte-equal to their source
        run: ./vendor-sync.sh check

      # check-pins.sh is vendored from the ci skill and proves on every run that it catches
      # each unpinned-lookup shape it claims
      - name: CI tools come from the lock, not the registry
        run: ./check-pins.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check:types

      - name: Lint
        run: npm run lint

      # The directory rejects a call to Obsidian API newer than minAppVersion, and the lint
      # rule for it misses some
      - name: Obsidian API is not newer than minAppVersion
        run: npm run check:since

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
